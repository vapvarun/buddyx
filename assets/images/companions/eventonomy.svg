<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Eventonomy">
  <defs>
    <linearGradient id="evGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D7C0F"/>
      <stop offset="1" stop-color="#365314"/>
    </linearGradient>
  </defs>
  <rect x="36" y="36" width="440" height="440" rx="120" fill="url(#evGrad)"/>
  <!-- calendar: a date with something happening -->
  <g>
    <!-- binding tabs -->
    <rect x="186" y="132" width="28" height="64" rx="14" fill="#FFFFFF"/>
    <rect x="298" y="132" width="28" height="64" rx="14" fill="#FFFFFF"/>
    <!-- body -->
    <rect x="140" y="166" width="232" height="204" rx="30" fill="#FFFFFF"/>
    <!-- header band divider -->
    <rect x="140" y="226" width="232" height="7" fill="#E6F0D5"/>
    <!-- the event day, marked -->
    <rect x="290" y="290" width="50" height="50" rx="14" fill="url(#evGrad)"/>
  </g>
</svg>
